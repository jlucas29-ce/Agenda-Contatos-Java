# =============================================
# APPLICATION
# =============================================
spring.application.name=agenda-app
server.port=8080

# =============================================
# DATASOURCE - PostgreSQL
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/agenda_db
spring.datasource.username=postgres
spring.datasource.password=2011
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# FLYWAY
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================
# JWT SECURITY
# =============================================
app.jwt.secret=3f8a7d2b9e1c4f6a0d5b8e3c7f2a9d4b6e1f8c5a2d7b0e3f6c9a2b5d8e1f4a7
app.jwt.expiration-ms=86400000

# =============================================
# SPRINGDOC / SWAGGER
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =============================================
# LOGGING
# =============================================
logging.level.com.agenda=INFO
logging.level.org.springframework.security=WARN
spring.main.allow-circular-references=true
